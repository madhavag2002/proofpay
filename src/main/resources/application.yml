spring:
  application:
    name: proofpay
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:h2:mem:proofpay;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5 
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 25MB
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${PORT:8080}
  # Render terminates HTTPS in front of the app; trust its X-Forwarded-* headers for correct URLs.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

proofpay:
  seller-name: ${SELLER_NAME:Agra Marble Crafts}
  seller-password: ${SELLER_PASSWORD:}
  time-zone: Asia/Kolkata
  shipping-days: ${SHIPPING_DAYS:12-20}
  paypal:
    mode: ${PAYPAL_MODE:mock}
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
    allow-unverified-webhooks: ${PAYPAL_ALLOW_UNVERIFIED_WEBHOOKS:false}
    mcp-command: ${PAYPAL_MCP_COMMAND:npx -y @paypal/mcp --tools=all}
  ai:
    mode: ${AI_MODE:mock}
    api-key: ${OPENAI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: https://api.openai.com
